<!DOCTYPE html>
<html>
    <head>
        <title>Background Clip</title>
        <style type="text/css">
        
        </style>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    </head>
    <body>
      
        <h1>This is tailwind css using CDN Link</h1>
   
        <div class="w-40 h-40 bg-violet-900 border-8 border-yellow-500 border-dashed bg-clip-border  my-5 p-5"></div>
        
        <div class="w-40 h-40 bg-violet-900 border-8 border-yellow-500 border-dashed bg-clip-padding my-5 p-5"></div>

        <div class="w-40 h-40 bg-violet-900 border-8 border-yellow-500 border-dashed bg-clip-content my-5 p-5"></div>

        <div class="w-40 h-40 bg-violet-900 border-8 border-yellow-500 border-dashed bg-clip-text my-5 p-5"></div>

        <hr class="my-5" />

        <div class="text-5xl text-transparent font-extrabold bg-clip-text bg-gradient-to-r from-blue-500 to-pink-500">
            <p>Save Myanmar</p>
            <p>Pray Myanmar</p>
            <p>Fight to Japu , Attact to Japu</p>
        </div>

        <hr class="my-5" />

        <div class="text-6xl font-extrabold">
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-violet-500">Hello Thailand</span>
            <br/>
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-black to-violet-500">Hello Srilanka</span>
        </div>


        <hr class="my-5" />

        <div class="text-6xl font-extrabold">
            <span class="bg-gradient-to-r from-pink-500 to-violet-500 box-decoration-slice">Save Myanmar <br/>Pary Myanmar</span>

            <hr class="my-5" />

            <span class="bg-gradient-to-r from-pink-500 to-violet-500 box-decoration-clone">Save Myanmar<br/> Pary Myanmar</span>
        </div>

    </body>
</html>

bg-clip-text                background-clip:text;

-->
