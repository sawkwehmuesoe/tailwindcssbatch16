<!DOCTYPE html>
<html>
    <head>
        <title>Brightness</title>
        <style type="text/css">
        

            .box{
                width: 300px;
                height: 200px;

                margin: 20px;
            }

         
        </style>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    </head>
    <body>
        <h1>This is tailwind css using CDN Link</h1>

        <div class="box brightness-0">
            <img src="./img/cutedog.jpg" class="" alt="cutedog">
        </div>

        <hr/>

        <div class="box brightness-0">
            <img src="./img/cutedog.jpg" class="" alt="cutedog">
        </div>

        <hr/>

        <div class="box brightness-50">
            <img src="./img/cutedog.jpg" class="" alt="cutedog">
        </div>

        <hr/>

        <div class="box brightness-75">
            <img src="./img/cutedog.jpg" class="" alt="cutedog">
        </div>

        <hr/>

        <div class="box brightness-100">
            <img src="./img/cutedog.jpg" class="" alt="cutedog">
        </div>

        <hr/>

        <div class="box brightness-125">
            <img src="./img/cutedog.jpg" class="" alt="cutedog">
        </div>

        <hr/>

        <div class="box brightness-150">
            <img src="./img/cutedog.jpg" class="" alt="cutedog">
        </div>

        <hr/>

        <div class="box brightness-200">
            <img src="./img/cutedog.jpg" class="" alt="cutedog">
        </div>

        <hr/>



    </body>
</html>

1s = 1000ms
