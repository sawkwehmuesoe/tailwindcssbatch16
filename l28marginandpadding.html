<!DOCTYPE html>
<html>
    <head>
        <title>Margin and Padding</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <!-- <script src="https://cdn.tailwindcss.com"></script> -->

        <style type="text/css">
         
            .bg-primary{
                background-color: blue;
            }

            .bg-secondary{
                background-color: gray;
            }

            .bg-info{
                background-color: skyblue;
            }

            .bg-success{
                background-color: green;
            }

            .bg-warning{
                background-color: orange;
            }

            .bg-danger{
                background-color: red;
            }
        </style>
    </head>
    <body>
        <h1>This is tailwind css using CDN Link</h1>

        <div class="w-40 h-40 bg-primary m-10">Div 1</div>
        <div class="w-40 h-40 bg-secondary mx-10">Div 2</div>
        <div class="w-40 h-40 bg-secondary my-10">Div 3</div>
        <div class="w-40 h-40 bg-secondary ml-10">Div 4</div>
        <div class="w-40 h-40 bg-secondary mr-10">Div 5</div>
        <div class="w-40 h-40 bg-secondary mt-10">Div 6</div>
        <div class="w-40 h-40 bg-secondary mb-10">Div 7</div>

        <br/>
        <hr/>
        <br/>

        <div class="w-40 h-40 bg-primary m-10 p-5">Div 1</div>
        <div class="w-40 h-40 bg-secondary mx-10 px-5">Div 2</div>
        <div class="w-40 h-40 bg-secondary my-10 py-5">Div 3</div>
        <div class="w-40 h-40 bg-secondary ml-10 pl-5">Div 4</div>
        <div class="w-40 h-40 bg-secondary mr-10 pr-5">Div 5</div>
        <div class="w-40 h-40 bg-secondary mt-10 pt-5">Div 6</div>
        <div class="w-40 h-40 bg-secondary mb-10 pb-5">Div 7</div>
        

    </body>
</html>
