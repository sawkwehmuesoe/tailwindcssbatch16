<!DOCTYPE html>
<html>
    <head>
        <title>Grayscale / Invert / Sepia</title>
        <style type="text/css">
        

            .box{
                width: 300px;
                height: 200px;

                margin: 20px;
            }

         
        </style>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    </head>
    <body>
        <h1>This is tailwind css using CDN Link</h1>

        <div class="box saturate-0">
            <img src="./img/cutedog.jpg" class="" alt="cutedog">
        </div>

        <hr/>

        <div class="box saturate-50">
            <img src="./img/cutedog.jpg" class="" alt="cutedog">
        </div>

        <hr/>

        <div class="box saturate-75">
            <img src="./img/cutedog.jpg" class="" alt="cutedog">
        </div>

        <hr/>

        <div class="box saturate-100">
            <img src="./img/cutedog.jpg" class="" alt="cutedog">
        </div>

        <hr/>

        <div class="box saturate-125">
            <img src="./img/cutedog.jpg" class="" alt="cutedog">
        </div>

        <hr/>

        <div class="box saturate-150">
            <img src="./img/cutedog.jpg" class="" alt="cutedog">
        </div>

        <hr/>

        <div class="box saturate-200">
            <img src="./img/cutedog.jpg" class="" alt="cutedog">
        </div>

        <hr/>


    

    </body>
</html> 

<!--

saturate-0                 filter:staturate(0);
saturate-50

saturate-100

saturate-150

saturate-200                filter:staturate(200);

-->
