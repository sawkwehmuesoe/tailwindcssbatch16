<!DOCTYPE html>
<html>
    <head>
        <title>Transition and Duration</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <!-- <script src="https://cdn.tailwindcss.com"></script> -->

        <style type="text/css">
        

            .box{
                width: 1200px;
                height: 200px;
                background-color: steelblue;

                margin: 20px;
            }

            .box img{
                width: 300px;
                height: 100%;
            }

            .box img:hover{
                transform: translate(900px);
            }
        
        </style>
    </head>
    <body>
        <h1>This is tailwind css using CDN Link</h1>

        <div class="box">
            <img src="./img/cutedog.jpg" class="transition duration-1000 ease-linear" alt="cutedog">
        </div>

        <hr/>

        <div class="box">
            <img src="./img/cutedog.jpg" class="transition duration-1000 ease-in" alt="cutedog">
        </div>

        <hr/>

        <div class="box">
            <img src="./img/cutedog.jpg" class="transition duration-1000 ease-out" alt="cutedog">
        </div>

        <hr/>

        <div class="box">
            <img src="./img/cutedog.jpg" class="transition duration-1000 ease-in-out" alt="cutedog">
        </div>

        <hr/>


    </body>
</html> 

<!--

1s = 1000ms
