<!DOCTYPE html>
<html>
    <head>
        <title>Object Fit</title>
        <style type="text/css">
        
        </style>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    </head>
    <body>
      
        <h1>This is tailwind css using CDN Link</h1>
   
        <div class="bg-indigo-300">
            <img src="./img/number.png" class="w-96 h-52 mx-auto" alt=""> 
        </div>

        <hr class="my-5" />

        <div class="bg-indigo-300">
            <img src="./img/number.png" class="w-96 h-52 mx-auto object-none" alt=""> object none
        </div>

        <hr class="my-5" />

        <div class="bg-indigo-300">
            <img src="./img/number.png" class="w-96 h-52 mx-auto object-contain" alt=""> object contain
        </div>

        <hr class="my-5" />

        <div class="bg-indigo-300">
            <img src="./img/number.png" class="w-96 h-52 mx-auto object-cover" alt=""> object cover
        </div>

        <hr class="my-5" />

        <div class="bg-indigo-300">
            <img src="./img/number.png" class="w-96 h-52 mx-auto object-fill" alt=""> object fill
        </div>

        <hr class="my-5" />

        <div class="bg-indigo-300">
            <img src="./img/number.png" class="w-95 h-52 mx-auto object-down" alt=""> object down
        </div>

        <hr class="my-5" />

    </body>
</html> 


<!--

object-none                     object-fit:none;
object-contain                  object-fit:contain;
object-cover                    object-fit:cover;
object-fill                     object-fit:fill;
object-down               object-fit:scale-down;

-->
