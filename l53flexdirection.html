<!DOCTYPE html>
<html>
    <head>
        <title>Fkex Direction</title>
        <style type="text/css">
        
        </style>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    </head>
    <body>
      
        <h1>This is tailwind css using CDN Link</h1> 

        <h5>flex-basis</h5>

        <div class="flex text-white">
            <div class="w-44 h-20 bg-green-900 basis-auto">DIV 1</div>
            <div class="w-44 h-20 bg-green-900">DIV 2</div>
            <div class="w-44 h-20 bg-green-900">DIV 3</div>
            <div class="w-44 h-20 bg-green-900">DIV 4</div>
            <div class="w-44 h-20 bg-green-900">DIV 5</div>
            <div class="w-44 h-20 bg-green-900">DIV 6</div>
        </div>

        <hr class="my-5" />

        <div class="flex flex-row-reverse text-white">
            <div class="w-44 h-20 bg-green-900 basis-auto">DIV 1</div>
            <div class="w-44 h-20 bg-green-900">DIV 2</div>
            <div class="w-44 h-20 bg-green-900">DIV 3</div>
            <div class="w-44 h-20 bg-green-900">DIV 4</div>
            <div class="w-44 h-20 bg-green-900">DIV 5</div>
            <div class="w-44 h-20 bg-green-900">DIV 6</div>
        </div>

        <hr class="my-5" />

        <div class="flex flex-col text-white">
            <div class="w-44 h-20 bg-green-900 basis-auto">DIV 1</div>
            <div class="w-44 h-20 bg-green-900">DIV 2</div>
            <div class="w-44 h-20 bg-green-900">DIV 3</div>
            <div class="w-44 h-20 bg-green-900">DIV 4</div>
            <div class="w-44 h-20 bg-green-900">DIV 5</div>
            <div class="w-44 h-20 bg-green-900">DIV 6</div>
        </div>

        <hr class="my-5" />

        <div class="flex flex-col-reverse text-white">
            <div class="w-44 h-20 bg-green-900 basis-auto">DIV 1</div>
            <div class="w-44 h-20 bg-green-900">DIV 2</div>
            <div class="w-44 h-20 bg-green-900">DIV 3</div>
            <div class="w-44 h-20 bg-green-900">DIV 4</div>
            <div class="w-44 h-20 bg-green-900">DIV 5</div>
            <div class="w-44 h-20 bg-green-900">DIV 6</div>
        </div>

        <hr class="my-5" />

       

    </body>
</html>
