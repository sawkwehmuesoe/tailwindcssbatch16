<!DOCTYPE html>
<html>
    <head>
        <title>Background Position</title>
        <style type="text/css">
        
        </style>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    </head>
    <body>
      
        <h1>This is tailwind css using CDN Link</h1>
   
        
        <div style="background-image:url('./img/cutedog.jpg');background-size: cover;" class="w-72 h-72 bg-no-repeat bg-left"></div>
 
        <hr class="my-5"/>

        <div style="background-image:url('./img/cutedog.jpg');background-size: cover;" class="w-72 h-72 bg-no-repeat bg-top"></div>

        <hr class="my-5"/>

        <div style="background-image:url('./img/cutedog.jpg');background-size: cover;" class="w-72 h-72 bg-no-repeat bg-right"></div>

        <hr class="my-5"/>

        <div style="background-image:url('./img/cutedog.jpg');background-size: cover;" class="w-72 h-72 bg-no-repeat bg-bottom"></div>


        <hr class="my-5"/>

        <div style="background-image:url('./img/cutedog.jpg');background-size: cover;" class="w-72 h-72 bg-no-repeat bg-center"></div>

        </div>

        <hr class="my-5"/>

        <div style="background-image:url('./img/cutedog.jpg');background-size: cover;" class="w-72 h-72 bg-no-repeat bg-left-top"></div>

        <hr class="my-5"/>

        <div style="background-image:url('./img/cutedog.jpg');background-size: cover;" class="w-72 h-72 bg-no-repeat bg-left-bottom"></div>

        <hr class="my-5"/>

        <div style="background-image:url('./img/cutedog.jpg');background-size: cover;" class="w-72 h-72 bg-no-repeat bg-right-top"></div>

        <hr class="my-5"/>

        <div style="background-image:url('./img/cutedog.jpg');background-size: cover;" class="w-72 h-72 bg-no-repeat bg-right-bottom"></div>

        <hr class="my-5"/>

    </body>
</html>
