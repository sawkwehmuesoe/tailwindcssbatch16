<!DOCTYPE html>
<html>
    <head>
        <title>Background Gradient</title>
        <style type="text/css">
        
        </style>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    </head>
    <body>
      
        <h1>This is tailwind css using CDN Link</h1>
   
        <div class="h-20 bg-gradient-to-l from-indigo-600 to-rose-500">Box 1</div>
        <hr class="my-5" />

        <div class="h-20 bg-gradient-to-t from-indigo-600 to-stone-500">Box 2</div>
        <hr class="my-5" />

        <div class="h-20 bg-gradient-to-r from-sky-600 to-yellow-500">Box 3</div>
        <hr class="my-5" />

        <div class="h-20 bg-gradient-to-b from-blue-600 to-rose-500">Box 4</div>
        <hr class="my-5" />

        <div class="h-20 bg-gradient-to-tl from-cyan-600 to-rose-500">Box 5</div>
        <hr class="my-5" />

        <div class="h-20 bg-gradient-to-bl from-amber-600 to-rose-500">Box 6</div>
        <hr class="my-5" />

        <div class="w-40 h-20 bg-gradient-to-r from-green-400 to-blue-500 text-white flex  justify-center items-center hover:from-pink-500 hover:to-yellow-400">Hover Me</div>
        <hr class="my-5" />

        <div class="w-40 h-20 bg-gradient-to-r from-green-400 to-blue-500 text-white flex  justify-center items-center hover:bg-gradient-to-t hover:from-pink-500 hover:to-yellow-400 ">Hover Me</div>
        <hr class="my-5" />
    </body>
</html>
