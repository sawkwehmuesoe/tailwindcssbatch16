<!DOCTYPE html>
<html>
    <head>
        <title>Pricing Box</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ==" crossorigin="anonymous" referrerpolicy="no-referrer">

        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="bg-stone-900">
    
        <div class="h-screen flex justify-center items-center">

            <div class="w-[700px] bg-[#f4f4f4] rounded-xl p-5">

                <div class="text-center mb-10">
                    <h2 class="font-sans text-gray-900 text-4xl font-bold tracking-tight">Our Pricing</h2>
                </div>

                <div class="grid grid-cols-2 gap-10">

                    <div>

                        <div class="bg-gray-900 rounded p-8">

                            <div class="text-center text-white mb-4">
                                <h3 class="text-xl font-medium tracking-widt">Standard Plan</h3>
                                <div class="flex justify-center items-center">
                                    <p class="font-semibold text-6xl">$55</p>
                                    <p class="text-gray-500 text-lg">/ month</p>
                                </div>
                            </div>

                            <ul class="text-white mb-8 space-y-4">
                                <li class="flex items-center">
                                    <div class="mr-3">
                                        <i class="fas fa-check-circle"></i>
                                    </div>
                                    <p class="text-gray-300 font-medium">1 Domain Name</p>
                                </li>
                                <li class="flex items-center">
                                    <div class="mr-3">
                                        <i class="fas fa-check-circle"></i>
                                    </div>
                                    <p class="text-gray-300 font-medium">10 GB Storage</p>
                                </li>
                                <li class="flex items-center">
                                    <div class="mr-3">
                                        <i class="fas fa-check-circle"></i>
                                    </div>
                                    <p class="text-gray-300 font-medium">100 Email Accoung</p>
                                </li>
                                <li class="flex items-center">
                                    <div class="mr-3">
                                        <i class="fas fa-check-circle"></i>
                                    </div>
                                    <p class="text-gray-300 font-medium">SSL Certificate</p>
                                </li>
                                <li class="flex items-center">
                                    <div class="mr-3">
                                        <i class="fas fa-check-circle"></i>
                                    </div>
                                    <p class="text-gray-300 font-medium">C-panel Fee</p>
                                </li>
                            </ul>

                            <button type="button" class="w-full bg-gray-700 text-white font-medium rounded-md tracking-wide text-2xl py-3">Order Now</button>

                        </div>

                        <div class="w-11/12 h-2 bg-gray-900 rounded-b mx-auto opacity-75"></div>
                        <div class="w-10/12 h-2 bg-gray-900 rounded-b mx-auto opacity-55"></div>
                        <div class="w-9/12 h-2 bg-gray-900 rounded-b mx-auto opacity-25"></div>

                    </div>

                    <div>

                        <div class="bg-gray-900 rounded p-8">

                            <div class="text-center text-white mb-4">
                                <h3 class="text-xl font-medium tracking-widt">Business Plan</h3>
                                <div class="flex justify-center items-center">
                                    <p class="font-semibold text-6xl">$70</p>
                                    <p class="text-gray-500 text-lg">/ month</p>
                                </div>
                            </div>

                            <ul class="text-white mb-8 space-y-4">
                                <li class="flex items-center">
                                    <div class="mr-3">
                                        <i class="fas fa-check-circle"></i>
                                    </div>
                                    <p class="text-gray-300 font-medium">1 Domain Name</p>
                                </li>
                                <li class="flex items-center">
                                    <div class="mr-3">
                                        <i class="fas fa-check-circle"></i>
                                    </div>
                                    <p class="text-gray-300 font-medium">10 GB Storage</p>
                                </li>
                                <li class="flex items-center">
                                    <div class="mr-3">
                                        <i class="fas fa-check-circle"></i>
                                    </div>
                                    <p class="text-gray-300 font-medium">100 Email Accoung</p>
                                </li>
                                <li class="flex items-center">
                                    <div class="mr-3">
                                        <i class="fas fa-check-circle"></i>
                                    </div>
                                    <p class="text-gray-300 font-medium">SSL Certificate</p>
                                </li>
                                <li class="flex items-center">
                                    <div class="mr-3">
                                        <i class="fas fa-check-circle"></i>
                                    </div>
                                    <p class="text-gray-300 font-medium">C-panel Fee</p>
                                </li>
                            </ul>

                            <button type="button" class="w-full bg-gray-700 text-white font-medium rounded-md tracking-wide text-2xl py-3">Order Now</button>

                        </div>

                        <div class="w-11/12 h-2 bg-gray-900 rounded-b mx-auto opacity-75"></div>
                        <div class="w-10/12 h-2 bg-gray-900 rounded-b mx-auto opacity-55"></div>
                        <div class="w-9/12 h-2 bg-gray-900 rounded-b mx-auto opacity-25"></div>

                    </div>

                </div>

            </div>

        </div>

    </body>
</html>
